<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Water Slider Jump - Enhanced</title>
    <style>
        :root { --bg-color: #4facfe; --bg-color-2: #00f2fe; }
        body { margin: 0; overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; background: #222; touch-action: none; }
        
        #game-container {
            position: relative; width: 100vw; height: 100vh;
            background: linear-gradient(var(--bg-color) 0%, var(--bg-color-2) 100%);
            background-image: linear-gradient(rgba(255,255,255,0.1) 2px, transparent 2px);
            background-size: 100% 100px;
            transition: background 2s ease, filter 2s ease;
        }

        /* プレイヤーのデザイン */
        #player {
            position: absolute; bottom: 50px; left: 100px;
            width: 50px; height: 50px; background: #ff4757;
            border-radius: 50%; border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 10; display: flex; align-items: center; justify-content: center;
        }
        #player::after { /* 目を付けて回転を見やすく */
            content: '● ●'; color: white; font-size: 10px; letter-spacing: 5px;
        }

        .obstacle {
            position: absolute; bottom: 50px;
            width: 40px; height: 60px; background: #2f3542;
            border-radius: 8px; z-index: 5;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
        }

        .particle {
            position: absolute; pointer-events: none;
            background: rgba(255,255,255,0.9); border-radius: 50%; z-index: 1;
        }

        /* UI */
        #ui-layer { position: absolute; top: 30px; left: 30px; color: white; z-index: 20; }
        #score { font-size: 48px; font-weight: 900; text-shadow: 3px 3px 0px rgba(0,0,0,0.2); }
        #high-score { font-size: 18px; background: rgba(0,0,0,0.2); padding: 2px 10px; border-radius: 10px; }

        .screen {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(0,0,0,0.7); color: white; z-index: 100; backdrop-filter: blur(5px);
        }
        
        button {
            padding: 18px 60px; font-size: 24px; cursor: pointer;
            background: #ffa502; border: none; border-radius: 50px;
            color: white; font-weight: bold; margin-top: 20px;
            box-shadow: 0 6px #e67e22; transition: 0.1s;
        }
        button:active { transform: translateY(4px); box-shadow: 0 2px #e67e22; }

        /* ステージ演出 */
        .stage-sunset { --bg-color: #ff7e5f; --bg-color-2: #feb47b; }
        .stage-night { --bg-color: #2c3e50; --bg-color-2: #000; filter: brightness(0.7); }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-layer">
        <div id="score">0</div>
        <div id="high-score">Best: 0</div>
    </div>
    <div id="player"></div>

    <div id="screen-title" class="screen">
        <h1 style="font-size: 70px; margin-bottom: 0;">SLIDER</h1>
        <p>SPACE or TAP TO JUMP</p>
        <button onclick="startGame()">START</button>
    </div>

    <div id="screen-gameover" class="screen" style="display:none;">
        <h2 style="font-size: 40px; margin:0;">GAME OVER</h2>
        <h1 id="final-score" style="font-size: 80px; color: #ff4757;">0</h1>
        <button onclick="startGame()">RETRY</button>
    </div>
</div>

<script>
    const container = document.getElementById('game-container');
    const player = document.getElementById('player');
    const scoreElement = document.getElementById('score');
    const highScoreElement = document.getElementById('high-score');
    
    let state = {
        score: 0,
        highScore: localStorage.getItem('sliderHighScore') || 0,
        isGameOver: true,
        speed: 8,
        y: 50,
        velocity: 0,
        obstacles: [],
        bgPos: 0,
        nextSpawn: 0
    };

    highScoreElement.innerText = "Best: " + state.highScore;

    // --- Audio System ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type, dur, vol = 0.1) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
    }

    // --- Visual Effects ---
    function createSplash(x, y, count = 8) {
        for (let i = 0; i < count; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 8 + 4;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            container.appendChild(p);
            
            let px = x + 25, py = y;
            let vx = (Math.random() - 0.5) * 12;
            let vy = Math.random() * 10 + 2;
            
            function updateP() {
                vy -= 0.5; px += vx; py += vy;
                p.style.left = px + 'px';
                p.style.bottom = py + 'px';
                if (py > 40) {
                    requestAnimationFrame(updateP);
                } else {
                    p.remove();
                }
            }
            requestAnimationFrame(updateP);
        }
    }

    // --- Main Game Loop ---
    function gameLoop() {
        if (state.isGameOver) return;

        // 1. Physics (Player)
        state.velocity -= 0.8; // Gravity
        state.y += state.velocity;
        if (state.y <= 50) {
            if (state.y < 50 && state.velocity < -2) {
                createSplash(100, 50, 5);
                playSound(150, 'sine', 0.1, 0.05);
            }
            state.y = 50;
            state.velocity = 0;
        }
        player.style.bottom = state.y + 'px';
        player.style.transform = `rotate(${state.y > 50 ? -state.velocity * 3 : 0}deg)`;

        // 2. Background Animation
        state.bgPos += state.speed;
        container.style.backgroundPosition = `0 ${state.bgPos}px`;

        // 3. Obstacles
        if (Date.now() > state.nextSpawn) {
            spawnObstacle();
            state.nextSpawn = Date.now() + Math.max(700, 2000 - state.score * 30);
        }

        state.obstacles.forEach((ob, index) => {
            let x = parseFloat(ob.style.left);
            x -= state.speed;
            ob.style.left = x + 'px';

            // Collision detection
            const pRect = player.getBoundingClientRect();
            const oRect = ob.getBoundingClientRect();
            
            if (pRect.right - 10 > oRect.left && 
                pRect.left + 10 < oRect.right && 
                pRect.bottom - 5 > oRect.top) {
                endGame();
            }

            // Score & Cleanup
            if (x < -50) {
                ob.remove();
                state.obstacles.splice(index, 1);
                state.score++;
                scoreElement.innerText = state.score;
                state.speed += 0.15;
                playSound(600 + state.score * 10, 'sine', 0.1, 0.05);
                updateDifficulty();
            }
        });

        requestAnimationFrame(gameLoop);
    }

    function spawnObstacle() {
        const ob = document.createElement('div');
        ob.className = 'obstacle';
        ob.style.left = window.innerWidth + 'px';
        container.appendChild(ob);
        state.obstacles.push(ob);
    }

    function updateDifficulty() {
        if (state.score === 15) container.classList.add('stage-sunset');
        if (state.score === 30) {
            container.classList.remove('stage-sunset');
            container.classList.add('stage-night');
        }
    }

    function startGame() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        state = {
            ...state,
            score: 0,
            isGameOver: false,
            speed: 8,
            y: 50,
            velocity: 0,
            obstacles: [],
            nextSpawn: Date.now() + 1000
        };
        
        scoreElement.innerText = "0";
        document.querySelectorAll('.obstacle').forEach(o => o.remove());
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        container.className = '';
        
        gameLoop();
    }

    function endGame() {
        state.isGameOver = true;
        playSound(100, 'sawtooth', 0.4, 0.2);
        if (state.score > state.highScore) {
            state.highScore = state.score;
            localStorage.setItem('sliderHighScore', state.highScore);
            highScoreElement.innerText = "Best: " + state.highScore;
        }
        document.getElementById('final-score').innerText = state.score;
        document.getElementById('screen-gameover').style.display = 'flex';
    }

    function jump() {
        if (state.y <= 50 && !state.isGameOver) {
            state.velocity = 18;
            createSplash(100, 50, 10);
            playSound(400, 'sine', 0.2);
        }
    }

    // Input Logic
    window.addEventListener('keydown', e => { if (e.code === 'Space') jump(); });
    window.addEventListener('touchstart', e => { 
        if (e.target.tagName !== 'BUTTON') {
            e.preventDefault(); 
            jump(); 
        }
    }, { passive: false });
    window.addEventListener('mousedown', e => {
        if (e.button === 0 && !state.isGameOver && e.target.tagName !== 'BUTTON') jump();
    });
</script>
</body>
</html>
